{% extends 'quoteapp/base.html' %}
{% load extract%}


{%block content%}

<div class="row">
    <div class="col-md-8">

        {% for quote in quotes %}

        <div class="quote" itemscope="" itemtype="http://schema.org/CreativeWork">
            <span class="text" itemprop="text">
                {{quote.quote}}
            </span>
            <span>by <small class="author" itemprop="author">{{quote.author.fullname}}</small>
                <a href="/author/{{quote.author.id}}">(about)</a>
            </span>
            <div class="tags">
                Tags:
                {% for tag in quote.tags.all %}
                <meta class="keywords" itemprop="keywords" content="change,deep-thoughts,thinking,world">

                <a class="tag">{{tag}}</a>

                {% endfor%}

            </div>
        </div>

        {% endfor %}

        <nav>
            <ul class="pagination">

                <li class="page-item">
                    <a class="{% if not quotes.has_previous %} disabled {% endif %} page-link"
                        href="{% if quotes.has_previous %} {% url 'quoteapp:root_pagination' quotes.previous_page_number %} {% else %} # {% endif %}">
                        <span aria-hidden="true">←</span> Previous
                    </a>
                </li>


                <li class="page-item">
                    <a class="{% if not quotes.has_next %} disabled {% endif %} page-link"
                        href="{% if quotes.has_next %} {% url 'quoteapp:root_pagination' quotes.next_page_number %} {% else %} # {% endif %}">Next
                        <span aria-hidden="true">→</span>
                    </a>
                </li>

            </ul>
        </nav>

    </div>

</div>

{% endblock %}
