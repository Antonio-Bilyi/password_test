<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    {% load static %}
    <link rel="stylesheet" href="{% static 'quoteapp/style.css' %}">
    <title>QuoteApp</title>
</head>

<body>
    <div class="container">

        <div class="row header-box pb-5 pt-3 align-items-center justify-content-between">

            <div class="col-md-8">
                <h1>
                    <a href="/" style="text-decoration: none">Quotes to Scrape</a>
                </h1>
            </div>

            <nav class="col-md-auto d-flex align-items-center gap-4">
                {% if user.is_authenticated %}

                <ul class="list-unstyled d-flex align-items-center gap-3 mb-0">
                    <li>
                        <a href="{% url 'quoteapp:add-author' %}" role="button" class="btn btn-outline-primary">Add
                            Author</a>
                    </li>
                    <li>
                        <a href="{% url 'quoteapp:add-quote' %}" role="button" class="btn btn-outline-primary">Add
                            Quote</a>
                    </li>
                </ul>

                <ul class="list-unstyled d-flex align-items-center gap-3 mb-0">
                    <li>Welcome <b>{{ user.username }}!</b></li>
                    <li><a class="btn btn-primary" href="{% url 'users:logout' %}">Logout</a></li>
                </ul>

                {% else %}

                <ul class="list-unstyled d-flex align-items-center gap-3 mb-0">
                    <li>
                        <a class="btn btn-primary" href="{% url 'users:signup' %}">Signup</a>
                    </li>
                    <li>
                        <a class="btn btn-primary" href="{% url 'users:login' %}">Login</a>
                    </li>
                </ul>

                {% endif %}
            </nav>

        </div>

        {% block content %} {% endblock %}

    </div>
</body>

</html>
