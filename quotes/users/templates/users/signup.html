{% extends "quoteapp/base.html" %}

{% block content %}

<div class="text-center">
    <h2>Sign Up</h2>
</div>

<div class="container d-flex justify-content-center mt-4">

    <form method="post" action="{% url 'users:signup' %}" accept-charset="utf-8"
        class="text-center border border-primary rounded p-4" style="max-width: 400px; width: 100%;">
        {% csrf_token %}

        <div class="d-flex flex-column align-items-center mb-3">
            <label for="{{ form.username.id_for_label }}" class="form-label">Username:</label>
            {{ form.username }}
            <span class="text-danger">{{ form.errors.username }}</span>
        </div>

        <div class="d-flex flex-column align-items-center mb-3">
            <label for="{{ form.email.id_for_label }}" class="form-label">Email:</label>
            {{ form.email }}
            <span class="text-danger">{{ form.errors.email }}</span>
        </div>

        <div class="d-flex flex-column align-items-center mb-3">
            <label for="{{ form.password1.id_for_label }}" class="form-label">Password:</label>
            {{ form.password1 }}
            <span class="text-danger">{{ form.errors.password1 }}</span>
        </div>

        <div class="d-flex flex-column align-items-center mb-3">
            <label for="{{ form.password2.id_for_label }}" class="form-label">Password confirmation:</label>
            {{ form.password2 }}
            <span class="text-danger">{{ form.errors.password2 }}</span>
        </div>

        <div class="d-flex justify-content-center gap-2">
            <button type="submit" class="btn btn-primary">Submit</button>
            <button type="reset" class="btn btn-secondary">Reset</button>
        </div>

    </form>

</div>

{% endblock %}
